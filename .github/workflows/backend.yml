name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: outagemap
          POSTGRES_PASSWORD: outagemap
          POSTGRES_DB: outagemap_test
          TZ: Asia/Colombo
          PGTZ: Asia/Colombo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outagemap -d outagemap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://outagemap:outagemap@localhost:5432/outagemap_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
